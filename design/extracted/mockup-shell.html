:root{
/* Base palette (verbatim from style reference) */
--color-page-cream:#f9f4f2;
--color-pure-white:#ffffff;
--color-charcoal-ink:#2d2c2b;
--color-graphite:#44423f;
--color-slate:#4b4c4d;
--color-stone:#63605d;
--color-driftwood:#c6c1b9;
--color-linen:#e2ded9;
--color-ash:#d0d0d0;
--color-soft-black:#000000;
--color-mindful-blue:#0061ef;
--color-sunbeam-yellow:#ffce00;
--color-deep-indigo:#3b197f;
--color-twilight-violet:#281466;
--color-plum:#5f2b89;
--color-mauve:#8144a8;
--color-celeste:#00a4ff;
--color-blush:#ffa1cc;
--color-brand-orange:#f47d31;
/* Semantic — surfaces */
--surface-page:var(--color-page-cream);
--surface-card:var(--color-pure-white);
--surface-accent:var(--color-sunbeam-yellow);
--surface-contemplative:var(--color-deep-indigo);
--surface-ink:var(--color-charcoal-ink);
/* Semantic — text */
--text-primary:var(--color-charcoal-ink);
--text-secondary:var(--color-graphite);
--text-tertiary:var(--color-slate);
--text-disabled:var(--color-stone);
--text-inverse:var(--color-pure-white);
--text-display:var(--color-soft-black);
--text-on-yellow:var(--color-charcoal-ink);
/* Semantic — borders */
--border-card:var(--color-linen);
--border-input:var(--color-ash);
--border-divider:var(--color-driftwood);
/* Semantic — actions */
--action-primary:var(--color-mindful-blue);
--action-dark:var(--color-charcoal-ink);
--accent-punctuation:var(--color-sunbeam-yellow);
--accent-dimitra:var(--color-deep-indigo);
/* Semantic — states */
--state-done:var(--color-mindful-blue);
--state-locked:var(--color-stone);
/* Subject colors — one per class (assignment lives in product data) */
--subject-chemistry:var(--color-mindful-blue);
--subject-orange:var(--color-brand-orange);
--subject-plum:var(--color-plum);
--subject-celeste:var(--color-celeste);
--subject-indigo:var(--color-deep-indigo);
--subject-yellow:var(--color-sunbeam-yellow);
}

:root{
--font-sans:'Apercu Pro',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
--font-weight-regular:400;
--font-weight-medium:500;
--font-weight-bold:700;
/* Scale */
--text-caption:12px;--leading-caption:1.5;--tracking-caption:-0.12px;
--text-body-sm:14px;--leading-body-sm:1.5;--tracking-body-sm:-0.14px;
--text-body:16px;--leading-body:1.5;--tracking-body:-0.16px;
--text-subheading:20px;--leading-subheading:1.33;--tracking-subheading:-0.5px;
--text-heading-sm:24px;--leading-heading-sm:1.33;--tracking-heading-sm:-0.6px;
--text-heading:32px;--leading-heading:1.3;--tracking-heading:-0.8px;
--text-heading-lg:40px;--leading-heading-lg:1.29;--tracking-heading-lg:-1px;
--text-display:52px;--leading-display:1.13;--tracking-display:-1.56px;
--text-display-lg:72px;--leading-display-lg:1.1;--tracking-display-lg:-2.16px;
}

:root{
--spacing-unit:4px;
--spacing-4:4px;--spacing-8:8px;--spacing-12:12px;--spacing-16:16px;--spacing-20:20px;--spacing-24:24px;--spacing-32:32px;--spacing-40:40px;--spacing-48:48px;--spacing-56:56px;--spacing-64:64px;--spacing-80:80px;--spacing-96:96px;
--page-max-width:1200px;
--section-gap:64px;
}

:root{
--radius-small:8px;
--radius-inputs:8px;
--radius-xl:12px;
--radius-cards:16px;
--radius-featured:24px;
--radius-featured-lg:32px;
--radius-pills:800px;
--radius-buttons:800px;
--shadow-subtle:rgba(65,61,69,0.2) 0px 2px 0px 0px;
--shadow-card:0 1px 2px rgba(0,0,0,0.04);
--shadow-float:0 8px 24px rgba(45,44,43,0.10);
}

body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);font-size:var(--text-body);line-height:var(--leading-body);letter-spacing:var(--tracking-body);-webkit-font-smoothing:antialiased}
a{color:var(--action-primary);text-decoration:none}
a:hover{color:var(--color-deep-indigo)}
::selection{background:var(--color-sunbeam-yellow);color:var(--color-charcoal-ink)}

<script type="text/babel">
const {TabBar,Wordmark,Avatar}=window.LumenDesignSystem_44a90c;
const tabs=[{id:'home',icon:'home',label:'Home'},{id:'modules',icon:'library_books',label:'Modules'},{id:'clinics',icon:'event',label:'Clinics'},{id:'progress',icon:'monitoring',label:'Progress'}];
function Phone({tab,children}){return <div className="phone"><div className="inner">{children}</div>{tab&&<TabBar active={tab} onChange={()=>{}} items={tabs}/>}</div>;}
function DeskNav({page}){
const link=(id,label)=><span style={{fontFamily:'var(--font-sans)',fontSize:'var(--text-body)',fontWeight:500,letterSpacing:'var(--tracking-body)',color:page===id?'var(--text-primary)':'var(--text-tertiary)',padding:'8px 12px'}}>{label}</span>;
return <div style={{background:'var(--surface-card)',borderBottom:'1px solid var(--border-card)'}}><div style={{maxWidth:1040,margin:'0 auto',padding:'14px 32px',display:'flex',alignItems:'center',gap:8}}>
<Wordmark size="sm"/><div style={{display:'flex',gap:4,marginLeft:24,flex:1}}>{link('home','Home')}{link('modules','Modules')}{link('clinics','Clinics')}{link('progress','Progress')}{link('about','About Dimitra')}</div><Avatar initials="NK" tone="neutral"/>
</div></div>;}
const noop=()=>{};
const mount=(id,cap,sub,node)=>{ReactDOM.createRoot(document.getElementById(id)).render(<React.Fragment><div className="cap">{cap}{sub&&<small>{sub}</small>}</div>{node}</React.Fragment>);};
mount('f-deskhome','Desktop — Home','primary surface: note, module, classes',<div className="desk"><DeskNav page="home"/><DesktopHome go={noop}/></div>);
mount('f-deskmodules','Desktop — Modules','class switcher · weekly archive',<div className="desk"><DeskNav page="modules"/><DesktopModules/></div>);
mount('f-deskabout','Desktop — About Dimitra','CV placeholder',<div className="desk"><DeskNav page="about"/><DesktopAbout/></div>);
mount('f-welcome','Welcome','invite-only sign-in',<Phone><WelcomeScreen onSignIn={noop}/></Phone>);
mount('f-home','Home','Dimitra’s note above the module',<Phone tab="home"><HomeScreen go={noop}/></Phone>);
mount('f-modules','Modules','classes → weekly modules',<Phone tab="modules"><ModulesScreen go={noop}/></Phone>);
mount('f-module','Module — locked','attempt gates the solutions',<Phone tab="modules"><ModuleScreen go={noop}/></Phone>);
mount('f-unlocked','Module — unlocked','after the attempt',<Phone tab="modules"><ModuleScreen go={noop} initialUnlocked/></Phone>);
mount('f-clinics','Clinics & 1:1','book a seat · recordings',<Phone tab="clinics"><ClinicsScreen/></Phone>);
mount('f-progress','Progress','parent-glanceable facts',<Phone tab="progress"><ProgressScreen/></Phone>);
mount('f-about','About Dimitra','CV placeholder',<Phone tab="home"><AboutScreen go={noop}/></Phone>);
</script>
