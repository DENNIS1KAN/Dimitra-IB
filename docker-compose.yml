# Optional real Postgres for dev (SPEC §9) — without a .env the app uses
# embedded PGlite instead. To use this: `docker compose up -d`, then
# `cp .env.example .env` (sets DATABASE_URL), then `npm run db:migrate`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: lumen_dev
      POSTGRES_DB: lumen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
