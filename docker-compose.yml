# Local Postgres for dev (SPEC §9). `docker compose up -d` then `npm run db:migrate`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: lumen_dev
      POSTGRES_DB: lumen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
